services:
  - type: web
    name: file-integrity-checker
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: FIC_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # --- Cyber AI Assistant (free tier) - add the key in the Render dashboard, not in git ---
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_SHARE_FILENAMES
        value: "0"

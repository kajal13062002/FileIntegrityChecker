<!DOCTYPE html>
<html>
<head>
    <title>Manage Users</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<h2>Manage Users</h2>

<a href="/admin/add_user" class="btn btn-primary mb-3">
Add New User
</a>

<table class="table table-bordered table-striped">

<thead class="table-dark">

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Role</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody>

{% for user in users %}

<tr>

<td>{{ loop.index }}</td>

<td>{{ user[1] }}</td>

<td>{{ user[2] }}</td>

<td>{{ user[4] }}</td>

<td>{{ user[5] }}</td>

<td>

<a href="/admin/edit-user/{{ user[0] }}" class="btn btn-warning btn-sm">
Edit
</a>

<a href="/admin/delete-user/{{ user[0] }}"
   class="btn btn-danger btn-sm"
   onclick="return confirm('Are you sure you want to delete this user?');">
    Delete
</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f6f9;
}

.sidebar{
height:100vh;
background:#212529;
padding-top:20px;
}

.sidebar a{
color:white;
display:block;
padding:15px;
text-decoration:none;
}

.sidebar a:hover{
background:#0d6efd;
}

.card{
border:none;
box-shadow:0px 2px 8px rgba(0,0,0,.2);
}

</style>

</head>

<body>

<div class="container-fluid">

<div class="row">

<!-- Sidebar -->

<div class="col-md-2 sidebar">

<h3 class="text-white text-center">
Admin
</h3>

<hr class="text-white">

<a href="#">Dashboard</a>

<a href="/admin/users">Manage Users</a>

<a href="/admin/files">Manage Files</a>

<a href="#">Integrity Logs</a>

<a href="#">Reports</a>

<a href="#">Settings</a>

<a href="#">Logout</a>

</div>

<!-- Main -->

<div class="col-md-10">

<nav class="navbar bg-white shadow-sm">

<div class="container-fluid">

<h4>
File Integrity Checker
</h4>

<span class="badge bg-primary fs-6">
Administrator
</span>

</div>

</nav>

<div class="container mt-4">

<div class="row">

<div class="col-md-3">

<div class="card bg-primary text-white">

<div class="card-body">

<h5>Total Users</h5>

<h2>0</h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-success text-white">

<div class="card-body">

<h5>Total Files</h5>

<h2>0</h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-warning">

<div class="card-body">

<h5>Modified Files</h5>

<h2>0</h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-danger text-white">

<div class="card-body">

<h5>Reports</h5>

<h2>0</h2>

</div>

</div>

</div>

</div>

<br>

<div class="card">

<div class="card-header bg-dark text-white">

Recent Users

</div>

<div class="card-body">

<table class="table table-bordered">

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Role</th>

</tr>

<tr>

<td colspan="4" class="text-center">

No Records Found

</td>

</tr>

</table>

</div>

</div>

<br>

<div class="card">

<div class="card-header bg-dark text-white">

Recent Uploaded Files

</div>

<div class="card-body">

<table class="table table-bordered">

<tr>

<th>ID</th>

<th>File Name</th>

<th>Hash</th>

<th>Status</th>

</tr>

<tr>

<td colspan="4" class="text-center">

No Files Uploaded

</td>

</tr>

</table>

</div>

</div>

</div>

</div>

</div>

</div>

</body>

</html>

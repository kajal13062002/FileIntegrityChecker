<!DOCTYPE html>
<html>
<head>
    <title>Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">
<h3>Edit User</h3>
</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">
<label>Name</label>
<input type="text" name="name" class="form-control" value="{{ user[1] }}" required>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control" value="{{ user[2] }}" required>
</div>

<div class="mb-3">
<label>Role</label>

<select name="role" class="form-select">

<option value="admin" {% if user[4]=='admin' %}selected{% endif %}>Admin</option>

<option value="user" {% if user[4]=='user' %}selected{% endif %}>User</option>

</select>

</div>

<button type="submit" class="btn btn-warning">
Update User
</button>

<a href="/admin/users" class="btn btn-secondary">
Back
</a>

</form>

</div>

</div>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Manage Files</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<h2>Manage Files</h2>

<table class="table table-bordered table-striped">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>User</th>
<th>File Name</th>
<th>SHA-256 Hash</th>
<th>Upload Date</th>
<th>Action</th>

</tr>

</thead>

<tbody>

{% for file in files %}

<tr>

<td>{{ file[0] }}</td>
<td>{{ file[1] }}</td>
<td>{{ file[2] }}</td>
<td>{{ file[4] }}</td>
<td>{{ file[5] }}</td>

<td>

<a href="/admin/delete-file/{{ file[0] }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete this file?')">

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>

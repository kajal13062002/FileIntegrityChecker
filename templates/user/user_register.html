<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Registration | File Integrity Checker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet">

<style>

:root{
    --ink:#e9f3fb;
    --mute:#8fa9bd;
    --line:rgba(140,190,220,.22);
    --field:rgba(5,18,32,.72);

    --cyan:#22d3ee;
    --cyan2:#0ea5e9;

    --bad:#ff7b93;
    --ok:#34d399;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    padding:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
    overflow-x:hidden;

    color:var(--ink);

    font-family:"Poppins",sans-serif;

    background:
        radial-gradient(
            circle at 15% 85%,
            rgba(0,210,190,.28),
            transparent 38%
        ),
        radial-gradient(
            circle at 90% 15%,
            rgba(75,60,210,.32),
            transparent 40%
        ),
        radial-gradient(
            circle at 50% 45%,
            rgba(0,120,170,.16),
            transparent 45%
        ),
        linear-gradient(
            135deg,
            #030b16 0%,
            #071827 45%,
            #06111f 100%
        );
}


/* BACKGROUND */

#topo{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    opacity:.30;

    pointer-events:none;
}


/* CARD */

.card{
    position:relative;

    width:100%;
    max-width:520px;

    padding:22px 25px 17px;

    border-radius:17px;

    border:1px solid rgba(140,190,220,.24);

    background:rgba(8,22,38,.84);

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    box-shadow:
        0 25px 60px rgba(0,0,0,.48),
        0 0 35px rgba(14,165,233,.08);
}


/* ICON */

.badge{
    width:42px;
    height:42px;

    margin:0 auto 7px;

    display:grid;
    place-items:center;

    border-radius:12px;

    border:1px solid rgba(34,211,238,.45);

    background:rgba(34,211,238,.07);

    box-shadow:
        0 0 20px rgba(34,211,238,.20);
}

.badge svg{
    width:22px;
    height:22px;
}


/* HEADING */

h1{
    margin:0;

    text-align:center;

    font-size:21px;

    line-height:1.3;

    font-weight:600;
}

.sub{
    margin:4px 0 13px;

    text-align:center;

    font-size:11.5px;

    color:var(--cyan);
}


/* ERROR BOX FROM FLASK */
.flash-err{
    background: rgba(255,123,147,0.1);
    border: 1px solid rgba(255,123,147,0.3);
    color: var(--bad);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    margin-bottom: 12px;
    text-align: center;
}


/* FORM GRID */

.grid{
    display:grid;

    grid-template-columns:repeat(6,1fr);

    gap:7px 11px;
}

.full{
    grid-column:span 6;
}

.half{
    grid-column:span 3;
}


/* LABEL */

label{
    display:block;

    margin-bottom:4px;

    font-size:11px;

    line-height:1.2;

    font-weight:500;

    color:var(--mute);
}


/* INPUT */

input,
select{
    width:100%;

    height:36px;

    padding:0 10px;

    font-family:"Poppins",sans-serif;

    font-size:12.5px;

    color:var(--ink);

    color-scheme:dark;

    background:var(--field);

    border:1px solid var(--line);

    border-radius:8px;

    outline:none;

    transition:
        border-color .15s,
        box-shadow .15s;
}

input::placeholder{
    color:#5d778d;

    font-size:12px;
}

input:focus,
select:focus{
    border-color:var(--cyan);

    box-shadow:
        0 0 0 2px rgba(34,211,238,.13);
}

[aria-invalid="true"]{
    border-color:var(--bad);
}


/* PASSWORD */

.pwrap{
    position:relative;
}

.pwrap input{
    padding-right:36px;
}

.eye{
    position:absolute;

    top:3px;
    right:3px;

    width:29px;
    height:30px;

    display:grid;
    place-items:center;

    border:0;

    border-radius:6px;

    background:transparent;

    color:var(--mute);

    cursor:pointer;
}

.eye:hover{
    color:var(--cyan);
}


/* ERROR */

.err{
    min-height:10px;

    margin-top:2px;

    font-size:9px;

    line-height:1.1;

    color:var(--bad);
}


/* BUTTON */

.btn{
    width:100%;

    height:40px;

    margin-top:8px;

    border:0;

    border-radius:8px;

    font-family:"Poppins",sans-serif;

    font-size:12px;

    font-weight:600;

    letter-spacing:.7px;

    color:#03202b;

    background:
        linear-gradient(
            90deg,
            var(--cyan),
            var(--cyan2)
        );

    box-shadow:
        0 7px 18px rgba(14,165,233,.28);

    cursor:pointer;

    transition:.15s;
}

.btn:hover{
    filter:brightness(1.08);

    box-shadow:
        0 8px 23px rgba(14,165,233,.38);
}

.btn:active{
    transform:translateY(1px);
}


/* FOOTER */

.trust{
    margin:10px 0 0;

    text-align:center;

    font-size:11px;

    letter-spacing:.9px;

    color:#7f9bb0;
}

.login{
    margin:5px 0 0;

    text-align:center;

    font-size:13px;

    color:#9ab0c1;
}

.login a{
    color:var(--cyan);

    font-size:13px;

    font-weight:600;

    text-decoration:none;
}

.login a:hover{
    text-decoration:underline;
}


/* MOBILE */

@media(max-width:440px){

    body{
        padding:9px;
    }

    .card{
        max-width:100%;

        padding:19px 16px 15px;
    }

    h1{
        font-size:19px;
    }

    .sub{
        font-size:11px;
    }

    .grid{
        grid-template-columns:1fr;

        gap:7px;
    }

    .full,
    .half{
        grid-column:span 1;
    }

    input,
    select{
        height:35px;

        font-size:12px;
    }

    .btn{
        height:39px;

        font-size:11.5px;
    }

    .trust{
        font-size:10px;
    }

    .login{
        font-size:12px;
    }

    .login a{
        font-size:12px;
    }
}

</style>

</head>


<body>


<!-- BACKGROUND -->

<svg
    id="topo"
    aria-hidden="true"
    preserveAspectRatio="xMidYMid slice">
</svg>


<!-- CARD -->

<main class="card" id="card">


<!-- HEADER -->

<div class="head">

    <div class="badge">

        <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#22d3ee"
            stroke-width="1.8"
            stroke-linejoin="round"
            stroke-linecap="round">

            <path
                d="M12 2.5l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6l8-3z"/>

            <path
                d="M9 12l2.2 2.2L15.5 10"/>

        </svg>

    </div>

    <h1>User Registration</h1>

    <p class="sub">
        Create your secure File Integrity Checker account
    </p>

</div>

{% if error %}
<div class="flash-err">{{ error }}</div>
{% endif %}


<!-- FORM (Connected with Flask Route) -->

<form id="f" method="POST" action="{{ url_for('user_register') }}" novalidate>

<div class="grid">


<!-- FULL NAME -->

<div class="full">

    <label for="name">
        Full Name
    </label>

    <input
        id="name"
        name="name"
        autocomplete="name"
        placeholder="Enter your full name">

    <div class="err"></div>

</div>


<!-- EMAIL -->

<div class="half">

    <label for="email">
        Email Address
    </label>

    <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        placeholder="Enter email">

    <div class="err"></div>

</div>


<!-- MOBILE -->

<div class="half">

    <label for="mobile">
        Mobile Number
    </label>

    <input
        id="mobile"
        name="mobile"
        type="tel"
        inputmode="numeric"
        autocomplete="tel"
        placeholder="Enter mobile number">

    <div class="err"></div>

</div>


<!-- GENDER -->

<div class="half">

    <label for="gender">
        Gender
    </label>

    <select id="gender" name="gender">

        <option value="">
            Select gender
        </option>

        <option value="Male">Male</option>

        <option value="Female">Female</option>

        <option value="Other">Other</option>

        <option value="Prefer not to say">Prefer not to say</option>

    </select>

    <div class="err"></div>

</div>


<!-- DATE OF BIRTH -->

<div class="half">

    <label for="dob">
        Date of Birth
    </label>

    <input
        id="dob"
        name="dob"
        type="date">

    <div class="err"></div>

</div>


<!-- CITY -->

<div class="half">

    <label for="city">
        City
    </label>

    <input
        id="city"
        name="city"
        autocomplete="address-level2"
        placeholder="Enter city">

    <div class="err"></div>

</div>


<!-- STATE -->

<div class="half">

    <label for="state">
        State
    </label>

    <input
        id="state"
        name="state"
        autocomplete="address-level1"
        placeholder="Enter state">

    <div class="err"></div>

</div>


<!-- PASSWORD -->

<div class="half">

    <label for="pw">
        Password
    </label>

    <div class="pwrap">

        <input
            id="pw"
            name="password"
            type="password"
            autocomplete="new-password"
            placeholder="Create password">

        <button
            type="button"
            class="eye"
            aria-label="Show password">
        </button>

    </div>

    <div class="err"></div>

</div>


<!-- CONFIRM PASSWORD -->

<div class="half">

    <label for="pw2">
        Confirm Password
    </label>

    <div class="pwrap">

        <input
            id="pw2"
            name="confirm_password"
            type="password"
            autocomplete="new-password"
            placeholder="Confirm password">

        <button
            type="button"
            class="eye"
            aria-label="Show password">
        </button>

    </div>

    <div class="err"></div>

</div>


</div>


<!-- BUTTON -->

<button
    class="btn"
    type="submit">

    CREATE ACCOUNT

</button>

</form>


<!-- FOOTER -->

<p class="trust foot">
    SECURE • ENCRYPTED • PROTECTED
</p>

<p class="login foot">

    Already have an account?

    <a href="{{ url_for('user_login') }}">
        User Login
    </a>

</p>

</main>


<script>

/* ================= TOPOGRAPHIC BACKGROUND ================= */

(function drawTopo(){

    const svg =
        document.getElementById("topo");

    const W = 1200;
    const H = 800;

    svg.setAttribute(
        "viewBox",
        `0 0 ${W} ${H}`
    );

    const centers = [
        [180,640,1],
        [1020,150,2],
        [620,90,3],
        [1080,700,4]
    ];

    let paths = "";

    centers.forEach(
        ([cx,cy,k]) => {

            for(
                let r=30;
                r<430;
                r+=26
            ){

                let d="";

                for(
                    let a=0;
                    a<=64;
                    a++
                ){

                    const t =
                        (a/64) *
                        Math.PI *
                        2;

                    const wobble =
                        1
                        +
                        0.16 *
                        Math.sin(
                            3*t+k+r/90
                        )
                        +
                        0.10 *
                        Math.sin(
                            5*t+k*2-r/60
                        )
                        +
                        0.06 *
                        Math.sin(
                            2*t+r/40
                        );

                    const x =
                        cx +
                        Math.cos(t) *
                        r *
                        wobble *
                        1.25;

                    const y =
                        cy +
                        Math.sin(t) *
                        r *
                        wobble;

                    d +=
                        `${a ? "L":"M"}${x.toFixed(1)} ${y.toFixed(1)}`;

                }

                paths +=
                    `<path d="${d}Z"/>`;

            }

        }
    );

    svg.innerHTML = `

        <g
            fill="none"
            stroke="#7fd8ee"
            stroke-opacity=".16"
            stroke-width="1">

            ${paths}

        </g>

    `;

})();


/* ================= PASSWORD EYE ================= */

const eyeOpen = `

<svg
    width="16"
    height="16"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round">

    <path
        d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>

    <circle
        cx="12"
        cy="12"
        r="3"/>

</svg>

`;

const eyeClosed = `

<svg
    width="16"
    height="16"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round">

    <path
        d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4M6.6 6.6A17 17 0 002 12s3.6 7 10 7a9.7 9.7 0 004.4-1"/>

</svg>

`;

document
.querySelectorAll(".eye")
.forEach(btn => {

    btn.innerHTML = eyeOpen;

    btn.addEventListener(
        "click",
        () => {

            const input =
                btn.previousElementSibling;

            const hidden =
                input.type === "password";

            input.type =
                hidden
                ? "text"
                : "password";

            btn.innerHTML =
                hidden
                ? eyeClosed
                : eyeOpen;

            btn.setAttribute(
                "aria-label",
                hidden
                ? "Hide password"
                : "Show password"
            );

        }
    );

});


/* ================= VALIDATION ================= */

const rules = {

    name:[
        v => v.length >= 2,
        "Enter your full name."
    ],

    email:[
        v =>
        /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v),

        "Enter a valid email address."
    ],

    mobile:[
        v =>
        /^\d{10}$/.test(
            v.replace(/[\s-]/g,"")
        ),

        "Enter a 10-digit mobile number."
    ],

    gender:[
        v => !!v,
        "Select a gender."
    ],

    dob:[
        v =>
        v &&
        new Date(v) < new Date(),

        "Enter a valid date of birth."
    ],

    city:[
        v => v.length >= 2,
        "Enter your city."
    ],

    state:[
        v => v.length >= 2,
        "Enter your state."
    ],

    pw:[
        v =>
        v.length >= 8 &&
        /[A-Za-z]/.test(v) &&
        /\d/.test(v),

        "Use 8+ characters with letters and numbers."
    ],

    pw2:[
        v =>
        v &&
        v ===
        document.getElementById("pw").value,

        "Passwords do not match."
    ]

};


/* ================= CHECK ================= */

function check(id){

    const el =
        document.getElementById(id);

    const value =
        id.startsWith("pw")
        ? el.value
        : el.value.trim();

    const invalid =
        !rules[id][0](value);

    const parent =
        el.closest(".pwrap") || el;

    const msg =
        parent.parentElement
        .querySelector(".err");

    msg.textContent =
        invalid
        ? rules[id][1]
        : "";

    el.setAttribute(
        "aria-invalid",
        invalid
    );

    return !invalid;
}


/* ================= BLUR ================= */

Object
.keys(rules)
.forEach(id => {

    document
    .getElementById(id)
    .addEventListener(
        "blur",
        () => check(id)
    );

});


/* ================= SUBMIT (Allows backend submission when valid) ================= */

document
.getElementById("f")
.addEventListener(
    "submit",
    e => {

        const results =
            Object
            .keys(rules)
            .map(check);

        if(!results.every(Boolean)){
            e.preventDefault(); // Rok dega agar front-end validation fail hui

            const firstError =
                document.querySelector(
                    '[aria-invalid="true"]'
                );

            if(firstError){
                firstError.focus();
            }
        }
        // Agar sabhi validation true hain, toh e.preventDefault() nahi chalega 
        // aur form seedha Flask backend (`app.py`) par submit ho jayega!
    }
);

</script>

</body>
</html>
